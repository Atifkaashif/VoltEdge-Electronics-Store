<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — VoltEdge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="app.js"></script>
</head>
<body data-page="shop">

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">🛍️ The store</span>
    <h1>Shop all electronics</h1>
    <p>Find your next favourite gadget. Filter by category, search by name, or sort by price.</p>
    <div class="crumbs"><a href="index.html">Home</a> / Shop</div>
  </div>
</section>

<section class="section" style="padding-top:44px">
  <div class="container">
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <div class="tools">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" class="input" type="search" placeholder="Search by product name…" aria-label="Search products">
        </div>
        <select id="sort" class="select" aria-label="Sort products">
          <option value="featured">Sort: Featured</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="rating">Top rated</option>
        </select>
        <label class="range-box">Max price
          <input type="range" id="range" min="0" max="2000" step="10" aria-label="Maximum price">
          <span id="rangeLabel" style="min-width:76px">Any</span>
        </label>
      </div>
    </div>
    <p class="result-count" id="count"></p>
    <div class="products" id="grid"></div>
  </div>
</section>

</body>
</html>
